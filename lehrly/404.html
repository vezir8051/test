<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lehrly · weiterleiten…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%231F5BB5'/><text x='50' y='70' text-anchor='middle' font-family='Helvetica,Arial' font-size='62' font-weight='700' fill='%23FFFFFF'>L</text></svg>">
<script>
/* SPA Deep-Link-Fallback: Vercel liefert diese Seite fuer unbekannte Pfade.
   Hash-Router-App -> Clean-Pfad in eine Hash-Route umschreiben und zur Startseite leiten. */
(function () {
  try {
    var p = window.location.pathname || '/';
    var q = window.location.search || '';
    // Bereits Root oder index -> einfach zur App
    if (p === '/' || p === '/index.html') { window.location.replace('/' + q); return; }
    // /profil -> /#/profil , /stellen/zkb -> /#/stellen/zkb
    var route = p.replace(/^\/+/, '').replace(/\/+$/, '');
    window.location.replace('/#/' + route + q);
  } catch (e) {
    window.location.replace('/');
  }
})();
</script>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       color:#1A2230;background:#F6F7F9}
  .box{text-align:center}
  a{color:#1F5BB5}
</style>
</head>
<body>
<div class="box">
  <p>Einen Moment — wir leiten dich weiter…</p>
  <p><a href="/">Zur Startseite von Lehrly</a></p>
</div>
</body>
</html>
