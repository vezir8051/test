<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lehrly">
<meta name="description" content="Lehrly.ch, die Schweizer Lehrstellenplattform. Lernende und Betriebe, die zusammenpassen.">
<meta name="theme-color" content="#0E1116">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230E1116'/><circle cx='50' cy='50' r='22' fill='none' stroke='%233DDC97' stroke-width='9'/><text x='50' y='66' text-anchor='middle' font-family='Helvetica,Arial' font-size='44' font-weight='800' fill='%23E8ECF2'>L</text></svg>">
<title>Lehrly.ch · Schweizer Lehrstellenplattform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     SVG ICON DEFS (Monoline) + dock-vermerk Stempel-Pfade
     ════════════════════════════════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-steckbrief" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></symbol>
  <symbol id="i-profil" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
  <symbol id="i-unterlagen" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-treffer" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-gespraeche" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
  <symbol id="i-cockpit" viewBox="0 0 24 24"><path d="M4 13a8 8 0 0116 0"/><path d="M12 13l4-3"/></symbol>
  <symbol id="i-betrieb" viewBox="0 0 24 24"><path d="M4 21V8l8-4 8 4v13"/><path d="M9 21v-6h6v6"/></symbol>
  <symbol id="i-ausschreiben" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-pool" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-pipeline" viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h6"/></symbol>
  <symbol id="i-cmd" viewBox="0 0 24 24"><path d="M9 6a2 2 0 10-2 2h10a2 2 0 10-2-2v10a2 2 0 102-2H7a2 2 0 10 2 2z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></symbol>
  <symbol id="i-tarif" viewBox="0 0 24 24"><path d="M4 8h16v9H4z"/><path d="M4 12h16"/></symbol>
</defs></svg>

<!-- ════════════════════════════════════════════════════════════════
     APP-SHELL — persistentes CSS-Grid [rail | canvas], kein Toggling
     ════════════════════════════════════════════════════════════════ -->
<div id="shell" class="shell" data-role="lernende">

  <!-- ── RAIL (immer sichtbar): Stations-/Fortschrittsschiene ── -->
  <aside id="rail" class="rail" aria-label="Laufbahn-Schiene">
    <div class="rail-head">
      <a class="wordmark" data-action="home" href="#" aria-label="Lehrly Startstation">
        <span class="wm-ring"></span><span class="wm-text">Lehrly</span>
      </a>
      <!-- Rollen-Kippschalter (radiogroup — kein tablist ohne tabpanel) -->
      <div id="role-switch" class="role-switch" role="radiogroup" aria-label="Rolle wählen">
        <button class="role-opt" data-role="lernende" data-short="L" role="radio" aria-checked="true"><span class="ro-text">Lernende</span></button>
        <button class="role-opt" data-role="betrieb" data-short="B" role="radio" aria-checked="false"><span class="ro-text">Betrieb</span></button>
        <span class="role-thumb" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Stations-Knoten werden von app.js gerendert -->
    <nav id="rail-stations" class="rail-stations" aria-label="Stationen"></nav>

    <div class="rail-foot">
      <button id="rail-cmd" class="rail-cmd" data-action="commander" aria-label="Kommando-Palette öffnen">
        <svg class="ic" aria-hidden="true"><use href="#i-cmd"></use></svg>
        <span class="rc-label">Befehl</span><kbd class="rc-kbd">⌘K</kbd>
      </button>
      <button id="rail-tarife" class="rail-tarife" data-action="pane" data-pane="tarife" aria-label="Pakete und Tarife">
        <svg class="ic" aria-hidden="true"><use href="#i-tarif"></use></svg>
        <span>Pakete</span>
      </button>
    </div>
  </aside>

  <!-- ── CANVAS: durchgehend scrollender Stationen-Strom ── -->
  <main id="canvas" class="canvas" tabindex="-1">
    <div id="stations" class="stations"></div>
  </main>

  <!-- ── PANE-STACK (global): einschiebende Stack-Panes ── -->
  <div id="pane-stack" class="pane-stack" aria-hidden="true"></div>
  <div id="pane-scrim" class="pane-scrim" data-action="pop-pane" hidden></div>

</div>

<!-- ── COMMANDER (Overlay, Cmd-K) ── -->
<div id="commander" class="commander" hidden>
  <div class="cmd-scrim" data-action="close-commander"></div>
  <div class="cmd-box" role="dialog" aria-modal="true" aria-label="Kommando-Palette">
    <div class="cmd-search">
      <svg class="ic" aria-hidden="true"><use href="#i-cmd"></use></svg>
      <input id="cmd-input" class="cmd-input" type="text" placeholder="Objekt oder Aktion suchen …" autocomplete="off"
             role="combobox" aria-expanded="true" aria-controls="cmd-results" aria-autocomplete="list"
             aria-activedescendant="" aria-label="Befehl suchen">
      <kbd class="cmd-esc">Esc</kbd>
    </div>
    <div id="cmd-results" class="cmd-results" role="listbox" aria-label="Treffer"></div>
  </div>
</div>

<!-- ── dock-vermerk Toast (andockende Sprech-Pille) ── -->
<div id="vermerk" class="vermerk" role="status" aria-live="polite" hidden></div>

<script src="js/app.js"></script>
<script src="vendor/agentation.bundle.js" defer></script>
</body>
</html>
