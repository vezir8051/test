<!DOCTYPE html>
<html lang="de-CH">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="css/styles.css">
</head>
<body data-role="lernende">

<!-- ════════════════════════════════════════════════════════════════
     TOP-HEADER (hell, sticky) — Wortmarke · Nav · Rollen-Umschalter · Login
     ════════════════════════════════════════════════════════════════ -->
<header id="topbar" class="topbar">
  <div class="topbar-inner">
    <button id="nav-hamburger" class="hamburger" data-action="toggle-menu" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mobile-menu">
      <svg class="ic" aria-hidden="true"><use href="#i-menu"></use></svg>
    </button>

    <a id="wordmark" class="wordmark" data-route="start" href="#/start" aria-label="Lehrly Startseite">
      <span class="wm-mark" aria-hidden="true">L</span><span class="wm-text">Lehrly</span>
    </a>

    <nav id="primary-nav" class="primary-nav" aria-label="Hauptnavigation"></nav>

    <div class="topbar-right">
      <div id="role-switch" class="role-switch" role="radiogroup" aria-label="Rolle wählen">
        <button class="role-opt" data-role="lernende" role="radio" aria-checked="true">Für Lernende</button>
        <button class="role-opt" data-role="betrieb" role="radio" aria-checked="false">Für Betriebe</button>
        <span class="role-thumb" aria-hidden="true"></span>
      </div>
      <button id="login-btn" class="btn btn-outline btn-sm" data-action="login">Anmelden</button>
    </div>
  </div>

  <!-- Mobile-Menü (Hamburger-Panel) -->
  <nav id="mobile-menu" class="mobile-menu" aria-label="Mobile Navigation" hidden></nav>
</header>

<!-- ════════════════════════════════════════════════════════════════
     ROUTER-OUTLET — Seiten/Routen werden von app.js gerendert
     ════════════════════════════════════════════════════════════════ -->
<main id="view" class="view" tabindex="-1" aria-live="off"></main>

<!-- ════════════════════════════════════════════════════════════════
     FOOTER (Trust-Block) — wird von app.js befüllt
     ════════════════════════════════════════════════════════════════ -->
<footer id="footer" class="footer"></footer>

<!-- ── Untere Tab-Bar (mobil) ── -->
<nav id="tabbar" class="tabbar" aria-label="Schnellnavigation"></nav>

<!-- ── Toast / Status-Live-Region ── -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- ── Cookie-Consent (CH/EU-konform) ── -->
<div id="consent" class="consent" role="region" aria-label="Cookie-Hinweis" hidden></div>

<script src="js/app.js"></script>
<script src="vendor/agentation.bundle.js" defer></script>
</body>
</html>
